## Refract Shaders v22.3.0 - shaders.properties
## Iris / OptiFine / VulkanMod shader configuration

# ---------------------------------------------------------------------
# Buffer formats (HDR scene color, packed normal/material, mipmapped
# Alpha channel was previously an unused hardcoded 1.0; it now carries
# that fragment's sky light (lmcoord.y) instead, which composite.fsh's
# rain-puddle pass reads to tell sky-exposed ground apart from ground
# sheltered under a roof.
colortex0Format = RGBA16F
colortex1Format = RGBA8
colortex2Format = RGBA16F
colortex3Format = RGBA16F

colortex0Clear = true
colortex1Clear = true
colortex2Clear = true
colortex3Clear = true

# ---------------------------------------------------------------------
# Options screen layout
# NOTE: submenu categories MUST be wrapped in square brackets in the
# top-level `screen=` line per the official OptiFine/Iris options spec
# (https://optifine.readthedocs.io/shaders_dev/options.html) - e.g.
# [SHADOWS], not bare SHADOWS. Missing brackets here was the cause of
# a blank/empty options screen in a previous version of this pack.
# ---------------------------------------------------------------------
## BUGFIX: profile.Potato/Lemon/Mid/High/Ultra below were declared with
## real values but never actually produced a profile button in-game.
## Per Iris's own docs, profile.X declarations alone don't create any
## UI - a literal <profile> token has to be added to a `screen` list for
## a profile button to appear. That token was missing here, so the
## profile system existed on paper but had no way to be reached from
## the Shader Pack Settings screen. Added at the front of the main
## screen list so it's the first thing shown.
screen = <profile> <empty> [SHADOWS] <empty> [AMBIENT_OCCLUSION] <empty> [LIGHTING] <empty> [SKY] <empty> [WATER] <empty> [WEATHER] <empty> [NIGHT] <empty> [ATMOSPHERE] <empty> [COLOR_GRADE]
screen.SHADOWS = SHADOW_RES SHADOW_DISTANCE SOFT_SHADOWS SHADOW_SOFTNESS SHADOW_MODE SSRT_SHADOW_STEPS SSRT_SHADOW_STEPS_LITE SSRT_SHADOW_RANGE COLORED_GLASS_STRENGTH GLASS_BLEED_STRENGTH GLASS_BLEED_DYNAMIC_SPREAD GLASS_BLEED_DUSK_MULTIPLIER GLASS_SKYLIGHT_STRENGTH FOLIAGE_SHADOW_STRENGTH
screen.AMBIENT_OCCLUSION = SSAO SSAO_STRENGTH SSAO_SAMPLES
screen.LIGHTING = GODRAY_STRENGTH GODRAY_STEPS BLOOM_STRENGTH BLOOM_THRESHOLD
screen.SKY = CLOUD_STEPS CLOUD_COVERAGE CLOUD_OPACITY NIGHT_CLOUD_GLOW FOG_DENSITY SHOW_STARS STAR_SIZE
screen.WATER = WATER_WAVE_HEIGHT WATER_CLARITY WATER_REFLECTION_MODE WATER_REFLECTION_STRENGTH WATER_FOAM_STRENGTH WATER_GLINT_STRENGTH CAUSTICS_STRENGTH UNDERWATER_DISTORTION UNDERWATER_FOG_DENSITY UNDERWATER_GODRAYS_STRENGTH CHROMATIC_DISPERSION_STRENGTH GLASS_REFRACTION_STRENGTH GLASS_GLARE_STRENGTH SWAMP_MURKINESS OCEAN_TEMPERATURE_TINT
screen.WEATHER = WET_REFLECTIONS WET_REFLECTIONS_STRENGTH CLOUD_SHADOW_STRENGTH RAIN_RIPPLE_STRENGTH
screen.NIGHT = NIGHT_DARKNESS TRUE_BLACK_NIGHTS NIGHT_BRIGHTNESS
screen.ATMOSPHERE = FIREFLIES FIREFLY_STRENGTH AURORA AURORA_STRENGTH SNOW_SPARKLE_STRENGTH FOLIAGE_BACKLIGHT_STRENGTH NIGHT_FOG_STRENGTH VOXY_COMPAT
screen.COLOR_GRADE = EXPOSURE SATURATION WARMTH VIGNETTE_STRENGTH

# ---------------------------------------------------------------------
# Quality profiles (selectable from the Iris/OptiFine shader options
# menu - look for the "Profile" dropdown at the top of the options
# screen). Each one sets a full batch of defines at once; picking a
# profile and then tweaking an individual slider afterward still works
# normally, the profile is just a starting point.
# ---------------------------------------------------------------------
