name: Publish to Modrinth

on:
  push:
    tags:
      - 'v*'
      - '*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package shader pack
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ZIP_NAME="refract-shaders-${VERSION}.zip"
          zip -r "${ZIP_NAME}" shaders CHANGELOG.md
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Publish to Modrinth
        uses: Modrinth/minotaur@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project_id: refract-shaders
          version_number: ${{ github.ref_name }}
          version_title: "Refract Shaders ${{ github.ref_name }}"
          version_type: release
          loaders: |
            iris
            optifine
          game_versions: |
            1.16.5
            1.17.1
            1.18.2
            1.19.4
            1.20.1
            1.20.2
            1.20.4
            1.20.6
            1.21
            1.21.1
          files: ${{ steps.package.outputs.zip_name }}
